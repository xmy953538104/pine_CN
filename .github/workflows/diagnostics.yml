name: Diagnostics Debug
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  # Keep the evidence from an already-running APK attempt when a later test fix
  # is pushed; duplicate runs for the same source commit still cancel.
  group: diagnostics-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native diagnostic tests
        run: |
          bash tools/tests/run-native-diagnostics.sh
          bash tools/tests/run-content-diagnostics.sh
          python3 tools/tests/test-preview-gates.py
          python3 tools/tests/test-android-smoke-deadlines.py
      # Temporary, read-only recovery of this repository's exact earlier ANR
      # evidence. The development executor cannot transfer signed artifacts.
      - name: Recover prior Pine ANR evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38961409089
          name: pine-android-runtime-macOS-24ff025e54ddabf5a1b2a9d2d924fc44930953eb
          path: prior-runtime
      - name: Print bounded prior ANR context
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path('prior-runtime')
          for name in ('runtime-report.json', 'settings-launch.txt', 'final-activities.txt'):
              path = root / name
              if path.is_file():
                  print(name + ':\n' + path.read_text(errors='replace')[:32000])
          for name in ('android-install-logcat.txt', 'android-logcat.txt', 'runtime-logcat.txt'):
              path = root / name
              if not path.is_file():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              # Print the Pine ANR itself first: a later flood of unrelated
              # system-app ANRs must not crowd the original app failure out.
              primary = [index for index, line in enumerate(lines)
                         if 'ANR in io.github.pine.emu.diagnostics' in line or
                         ('am_anr' in line and 'io.github.pine.emu.diagnostics' in line)]
              print(name + ': exact Pine ANR matches=' + str(len(primary)))
              for index in primary[:8]:
                  print('\n'.join(lines[max(0, index - 6):index + 65])[:24000])
              selected = set()
              for index, line in enumerate(lines):
                  if 'io.github.pine.emu.diagnostics' in line:
                      selected.update(range(max(0, index - 3), min(len(lines), index + 8)))
              context = '\n'.join(lines[index] for index in sorted(selected))
              print(name + ': first/last Pine context:\n' + context[:48000] + '\n' + context[-48000:])
          PY
  adb:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fake ADB PowerShell 5.1 tests
        shell: powershell
        run: ./tools/tests/pine-diag.Tests.ps1
      - name: Fake ADB pwsh tests
        if: always()
        shell: pwsh
        run: ./tools/tests/pine-diag.Tests.ps1
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android build tools
        run: sdkmanager 'ndk;27.3.13750724' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      # Validate the root wrapper before obtaining native-only submodules. Their
      # sample Gradle wrappers are not used by this CMake build (Oboe includes an
      # unverifiable 2013 wrapper). Keep root validation enabled.
      - uses: gradle/actions/setup-gradle@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: diagnostics-ndk-27.3
          max-size: 3Gi
      - name: Native dependencies at pinned revisions
        run: git submodule update --init --recursive --depth 1 --jobs 8
      - name: JVM tests and Debug APK
        env:
          IS_BUILD_SIGNED: 'false'
          SIGNING_STORE_PATH: unused.jks
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: 'string:27.3.13750724'
        run: ./gradlew --no-daemon testFullDebugUnitTest processFullReleaseMainManifest assembleFullDebug --stacktrace
      - name: Verify APK identity and checksums
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          apk=app/build/outputs/apk/full/debug/app-full-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > app/build/outputs/apk/full/debug/apk-badging.txt
          python3 tools/verify-diagnostics-apk.py "$apk" "$EXPECTED_COMMIT"
      - name: Upload Debug APK
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci')
        uses: actions/upload-artifact@v4
        with:
          name: pine-diagnostics-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/full/debug/apk-badging.txt
            app/build/outputs/apk/full/debug/build-identity.json
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-jvm-reports
          path: app/build/reports/tests/

  android-runtime:
    name: Android runtime attempt (${{ matrix.runner }})
    needs: debug-apk
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci')
    # Standard runners are free for this public repository. Intel macOS offers
    # an independent official Hypervisor.Framework probe without changing KVM
    # permissions on Linux. ARM macOS hosted runners do not support nesting.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Official Android image
        # The actual API35 r9 bridge supports CNTFRQ in all decoder engines;
        # API36 booted but its framework ANRs blocked the Settings observation.
        run: sdkmanager 'system-images;android-35;google_apis;x86_64'
      - uses: actions/download-artifact@v4
        with:
          name: pine-diagnostics-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime-apk
      - name: Attempt actual ARM64 APK through official Android native translation
        run: bash tools/tests/attempt-android-runtime.sh runtime-apk/app-full-debug.apk '${{ github.event.pull_request.head.sha || github.sha }}' runtime-evidence
      - name: Print exact runtime result and bounded environment evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('runtime-evidence')
          # Preserve the actual launch response even when later UI commands
          # exhaust the recent-command tail or artifact transfer is unavailable.
          for name in ('install.txt', 'settings-launch.txt', 'installed-apk-sha256.txt'):
              path = root / name
              if path.is_file():
                  print(name + ':\n' + path.read_text(errors='replace')[-8000:])
          report = root / 'runtime-report.json'
          if report.is_file():
              result = json.loads(report.read_text())
              print(json.dumps(result, ensure_ascii=False, sort_keys=True))
              # Keep failed UI observations reviewable even when an artifact
              # cannot be transferred from this execution environment.
              if result.get('status') != 'verified':
                  xml_names = []
                  for check in result.get('checks', {}).values():
                      if check.get('status') != 'pass':
                          xml_names.extend(name for name in check.get('evidence', []) if name.endswith('.xml'))
                  for name in list(dict.fromkeys(xml_names))[-6:]:
                      path = root / name
                      if path.is_file() and path.parent == root:
                          print(name + ':\n' + path.read_text(errors='replace')[:16000])
                  commands = root / 'commands.jsonl'
                  if commands.is_file():
                      print('Recent ADB observations:\n' + '\n'.join(commands.read_text(errors='replace').splitlines()[-20:])[-24000:])
          else:
              print('No runtime report was produced; no APK execution result is claimed.')
          for name in ('host.txt', 'accel-check.txt'):
              path = root / name
              if path.is_file():
                  print(name + ': ' + path.read_text(errors='replace')[-4096:])
          for name in ('runtime-logcat.txt', 'crash-buffer.txt'):
              path = root / name
              if path.is_file():
                  print(name + ':\n' + path.read_text(errors='replace')[:48000])
          # Best-effort failure probes may be refused on an official image;
          # preserve those errors without treating them as functional passes.
          names = ['last-anr.txt', 'last-anr.stderr.txt', 'pine-process-ids.txt', 'pine-process-ids.stderr.txt']
          names.extend(path.name for pattern in ('pine-maps-[0-9]*.txt', 'pine-native-backtrace-[0-9]*.txt')
                       for path in sorted(root.glob(pattern)))
          for name in names:
              path = root / name
              if path.is_file():
                  print(name + ':\n' + path.read_text(errors='replace')[:64000])
          for name in ('android-framework-logcat.txt', 'android-install-logcat.txt', 'android-logcat.txt'):
              path = root / name
              if path.is_file():
                  lines = path.read_text(errors='replace').splitlines()
                  relevant = [line for line in lines if any(word in line for word in ('WATCHDOG', 'Watchdog', 'SystemServer', 'system_server', 'DeadSystemException', 'FATAL EXCEPTION IN SYSTEM PROCESS', 'Lost network stack', 'ConnectivityModuleConnector', 'Failure calling service package', 'ndk_translation', 'Undefined instruction'))]
                  print(name + ':\n' + '\n'.join(relevant[-30:])[-12000:])
          PY
      - name: Runtime evidence (includes blocked attempts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pine-android-runtime-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime-evidence/
