name: Runtime observer controlled pipeline
on:
  push:
    branches: [feat/nce-runtime-observation]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/src/main/cpp/skyline/diagnostics/**'
      - 'app/src/main/cpp/skyline/nce*'
      - 'app/src/main/cpp/skyline/nce/**'
      - 'app/src/main/cpp/skyline/loader/**'
      - 'app/src/main/cpp/skyline/kernel/**'
      - 'tests/runtime_observer/**'
      - 'tools/tests/test-runtime*'
      - '.github/workflows/runtime-observer.yml'
permissions:
  contents: read
concurrency:
  group: runtime-observer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bionic-windows-kit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.kit.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Preserve the published df37902a runtime and tool behavior
        run: >-
          git diff --exit-code df37902a1d030bddad1965b1716cad9714a09c35 HEAD --
          app/src/main/cpp tests/runtime_observer tools/tests/test-runtime-lifecycle.py
          tools/tests/test-runtime-pipeline.py tools/android-bionic/build-bundle.py
          tools/android-bionic/run-once.js tools/android-bionic/Start-PineBionic.cmd
          tools/android-bionic/Run-PineBionic.ps1 tools/android-bionic/README.zh-CN.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Official pinned NDK
        run: sdkmanager 'ndk;27.3.13750724'
      - name: Fixed official Windows Node and its versioned license
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib,os,runpy
          settings=runpy.run_path('tools/android-bionic/build-bundle.py')
          directory=Path(os.environ['RUNNER_TEMP'])/'bionic-inputs';directory.mkdir()
          for name,url in [('node.exe',settings['NODE_ORIGIN']),('Node-LICENSE','https://raw.githubusercontent.com/nodejs/node/v24.19.0/LICENSE')]:
              with urlopen(url,timeout=60) as source,(directory/name).open('wb') as output:
                  while block:=source.read(1024*1024):output.write(block)
          actual=hashlib.sha256((directory/'node.exe').read_bytes()).hexdigest()
          assert actual==settings['NODE_SHA'],actual
          print('PASS official Windows Node SHA256',actual)
          PY
      - name: Package complete independent Windows and Android kit (no APK)
        id: kit
        run: |
          python3 tools/android-bionic/build-bundle.py \
            --output "$RUNNER_TEMP/bionic-publication" \
            --ndk-cxx "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" \
            --windows-node "$RUNNER_TEMP/bionic-inputs/node.exe" \
            --node-license "$RUNNER_TEMP/bionic-inputs/Node-LICENSE"
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('artifact-name=Pine-Bionic-Windows-Once-'+commit+'\n')
          folder=Path(os.environ['RUNNER_TEMP'])/'bionic-publication'
          archive=folder/('Pine-Bionic-Once-'+commit[:8]+'.zip')
          subprocess.run(['python3','tools/android-bionic/verify-bundle.py',str(archive),'--expected-commit',commit,'--report',str(folder/'package-verification.json')],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.kit.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/bionic-publication/*.zip
            ${{ runner.temp }}/bionic-publication/package-verification.json
          if-no-files-found: error
          compression-level: 0
  verify-downloaded-windows-kit:
    needs: bionic-windows-kit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.bionic-windows-kit.outputs.artifact-name }}
          path: ${{ runner.temp }}/bionic-downloaded
      - name: Verify the downloaded full ZIP and execute its Windows runtime only
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'bionic-downloaded'
          $archives = @(Get-ChildItem $folder -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one complete kit ZIP' }
          $commit = git rev-parse HEAD
          python tools/android-bionic/verify-bundle.py $archives[0].FullName --expected-commit $commit
          if ($LASTEXITCODE) { throw 'Downloaded kit verification failed' }
          $expanded = Join-Path $env:RUNNER_TEMP 'bionic-expanded'
          Expand-Archive $archives[0].FullName $expanded
          $kit = Join-Path $expanded ('Pine-Bionic-Once-' + $commit.Substring(0,8))
          $version = & (Join-Path $kit 'host/node.exe') --version
          if ($LASTEXITCODE -or $version -ne 'v24.19.0') { throw 'Packaged Windows runtime failed' }
          & (Join-Path $kit 'host/node.exe') --check (Join-Path $kit 'host/run-once.js')
          if ($LASTEXITCODE) { throw 'Packaged collector syntax failed' }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $kit 'Run-PineBionic.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          Write-Output 'PASS downloaded complete Windows kit; Node/CMD/PS/collector/ARM64 ELF/libc++/manifest/guides verified. ANDROID_EXECUTION_PENDING.'
  controlled:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IS_BUILD_SIGNED: 'false'
      SIGNING_STORE_PATH: unused.jks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Official signed Ubuntu AArch64 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user g++-aarch64-linux-gnu
          dpkg-query -W qemu-user g++-aarch64-linux-gnu
      - name: Production identity lifecycle and admission regressions
        run: python3 tools/tests/test-runtime-observer.py
      - name: Execute production thread and owner retirement boundaries
        run: python3 tools/tests/test-runtime-lifecycle.py --aarch64 --fortify --output lifecycle-evidence
      - name: Assemble exact producer and compare production words
        run: |
          aarch64-linux-gnu-gcc -c app/src/main/cpp/skyline/nce/observation_stub.S -o /tmp/producer.o
          aarch64-linux-gnu-objcopy -O binary --only-section=.text /tmp/producer.o /tmp/producer.bin
          python3 - <<'PY'
          import re,struct
          from pathlib import Path
          s=Path('app/src/main/cpp/skyline/nce/observation_words.h').read_text()
          words=[int(x,16) for x in re.findall(r'0x([0-9a-fA-F]{8})',s)]
          assert words and Path('/tmp/producer.bin').read_bytes()==struct.pack('<'+'I'*len(words),*words)
          print('PASS assembled production producer byte equality',len(words)*4)
          PY
      - name: Execute actual source pipeline under controlled QEMU AArch64
        run: python3 tools/tests/test-runtime-pipeline.py --aarch64 --output runtime-evidence
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724'
      - name: Compile the same boundaries against Android bionic without building an APK
        run: >-
          python3 tools/tests/test-runtime-lifecycle.py --aarch64 --compile-only
          --cxx "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          --output lifecycle-ndk-evidence
      - uses: gradle/actions/setup-gradle@v4
      - name: Actual Diagnostics exporter preserves controlled runtime rows
        env:
          PINE_RUNTIME_PIPELINE_CAPTURE: ${{ github.workspace }}/runtime-evidence/logs/unknown
          PINE_RUNTIME_PIPELINE_REPORT: ${{ github.workspace }}/runtime-evidence/export.json
        run: |
          ./gradlew --no-daemon --build-cache -PpineNativeDebugOptimization=2 testFullDebugUnitTest --dry-run > runtime-evidence/unit-task-graph.txt
          python3 tools/ci/verify-jvm-only.py runtime-evidence/unit-task-graph.txt
          ./gradlew --no-daemon --build-cache -PpineNativeDebugOptimization=2 testFullDebugUnitTest --tests emu.skyline.diagnostics.RuntimePipelineExportTest --rerun-tasks --stacktrace
      - name: Evidence scope and hashes
        if: always()
        run: |
          if test -f runtime-evidence/result.json; then cat runtime-evidence/result.json; fi
          if test -f runtime-evidence/export.json; then cat runtime-evidence/export.json; fi
          if test -d runtime-evidence; then find runtime-evidence -type f -exec sha256sum {} + > runtime-evidence-sha256.txt; else : > runtime-evidence-sha256.txt; fi
          cat runtime-evidence-sha256.txt
          : > lifecycle-evidence-sha256.txt
          for directory in lifecycle-evidence lifecycle-ndk-evidence; do
            if test -d "$directory"; then find "$directory" -type f -exec sha256sum {} + >> lifecycle-evidence-sha256.txt; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-observer-controlled-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            runtime-evidence/result.json
            runtime-evidence/logs/**/*.jsonl
            runtime-evidence/*.json
            runtime-evidence/*.zip
            runtime-evidence/unit-task-graph.txt
            runtime-evidence-sha256.txt
            lifecycle-evidence/
            lifecycle-ndk-evidence/
            lifecycle-evidence-sha256.txt
            app/build/test-results/testFullDebugUnitTest/
